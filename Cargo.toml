[workspace]
# Resolver 3 is what edition 2024 selects for a package; a *workspace* has to
# ask for it explicitly, and cargo warns on the mismatch until it does. It also
# honours `rust-version` when picking versions, which is what keeps a resolve
# from quietly pulling a crate that needs a newer compiler than the MSRV below.
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/hystax/optscale-kompressor"

[workspace.dependencies]
# --- engine ---
serde = { version = "1", features = ["derive"] }
# preserve_order keeps object key order; arbitrary_precision keeps
# numeric literals byte-exact, so a JSON round-trip cannot silently rewrite 1e5.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
regex = "1"
memchr = "2"
blake2 = "0.11"
base64 = "0.23"
flate2 = "1"
# Request-body decoding. codex sends `content-encoding: zstd` on every request
# (measured on 0.155.1), and a body the proxy cannot parse is a body it cannot
# compress — so this is the difference between working and silently not.
zstd = { version = "0.14", default-features = false }
csv = "1"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"

# --- runtime / server ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util", "process"] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "limit", "timeout", "request-id", "util"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["server", "server-auto", "service", "tokio"] }
ring = "0.17"
pem = "4"
time = { version = "0.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
futures = "0.3"
futures-util = "0.3"
# Upstream half of the websocket relay. `rustls-tls-webpki-roots` deliberately
# matches reqwest's rustls below: a second TLS stack in one binary is a second
# set of roots to keep current and a second place a handshake can fail.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# reqwest 0.13 split the old `rustls-tls` feature in two: `rustls` selects the
# stack, `webpki-roots` the root store it trusts. Naming both keeps the same
# combination 0.12 bundled under one name — a change of spelling, not of trust.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "http2", "stream", "json"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# --- storage ---
rusqlite = { version = "0.40", features = ["bundled"] }

# --- cli / config ---
clap = { version = "4", features = ["derive", "env"] }
toml = "1"
humantime-serde = "1"

# --- misc ---
anyhow = "1"
thiserror = "2"
once_cell = "1"
parking_lot = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"       # the engine relies on catch_unwind to fail open
