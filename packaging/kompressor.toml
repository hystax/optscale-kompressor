# kompressor — system service configuration.
#
# Installed to /etc/kompressor/config.toml and marked a conffile, so a package
# upgrade will not overwrite your edits.
#
# Mode 0644: readable by everyone. Nothing here is a credential — every upstream
# sets `forward_auth = true`, so the caller's own key is forwarded and none is
# stored. IF YOU ADD A SECRET HERE — an `[auth]` token, or an upstream key with
# forward_auth = false — tighten the file at the same time:
#   chown root:kompressor /etc/kompressor/config.toml && chmod 0640 /etc/kompressor/config.toml
# The service account is in that group, so it keeps working.
#
# The loader does NOT expand `$HOME` or `~`, and a system service has no useful
# home anyway: it runs as the unprivileged `kompressor` user with
# StateDirectory=kompressor, which systemd creates and owns at
# /var/lib/kompressor. Those are the paths below. A path spelled
# `$HOME/.local/share/...` would be taken literally and create a directory
# called `$HOME` under the service's working directory.
#
# /etc is not on the loader's search path (KOMPRESSOR_CONFIG, ./kompressor.toml,
# then XDG), so the unit passes --config explicitly.

# Serves Codex (HTTP and the websocket relay) and Claude (Claude Code on the
# base URL, Claude Desktop through the TLS intercept below), each with the
# settings measured for it. Anthropic-only settings sit under
# [proxy.providers.anthropic]; Codex runs on the deployment defaults.
#
# Codex:          OPENAI_BASE_URL=http://127.0.0.1:8817/v1   (or `kompressor wrap codex`)
# Claude Code:    ANTHROPIC_BASE_URL=http://127.0.0.1:8817    (or `kompressor wrap claude`)
# Claude Desktop: HTTPS_PROXY=http://127.0.0.1:8840 and NODE_EXTRA_CA_CERTS set
#                 to ca.pem under `ca_path` (docs/CLAUDE-DESKTOP.md)

[server]
listen = "127.0.0.1:8817"

# Deployment defaults: what Codex traffic runs under. Code elision on, the
# client's own cache markers, the provider's default cache lifetime.
[engine]
mode = "recoverable"
# The 64 KiB default drops recoverability on exactly the payloads worth
# compressing: a fold or an elision over that size keeps no fragment.
max_ref_bytes = 1048576

[refs]
backend = "sqlite"
path = "/var/lib/kompressor/refs.db"

[stats]
enabled = true
path = "/var/lib/kompressor/stats.db"

[log]
level = "info"
format = "json"

[proxy]
retrieve_tool = "auto"
frozen_prefix = "marker"
cache_ttl = "default"
# Codex opens ws://.../v1/responses before trying HTTPS, and a ChatGPT-plan
# session cannot be told not to. Relaying it is what keeps such a session on
# this proxy, compressed. Refusing it costs about thirteen seconds of retries
# per session and compresses nothing.
#
# Written out rather than left to the default, which is `true`: commenting this
# key out does not disable the relay, it only hides which way it is set.
websocket_relay = true

# --- Claude: provider-specific settings (DESIGN.md §12.11) -----------------
# Applies to every Anthropic Messages request, whether it arrives on the base
# URL (Claude Code CLI) or through the intercept below (Claude Desktop), and to
# nothing else. Measured on Claude Opus 5.5:
#   * retrieve_tool "always": changing the tool list mid-conversation would
#     throw away Anthropic's cached prefix.
#   * frozen_prefix "first_seen": Claude Code pins cache_control on the final
#     message, so the marker rule would freeze the whole conversation.
#   * cache_ttl "adaptive": one-hour cache entries once a conversation has
#     paused past five minutes.
#   * no function-body elision: bodies were fetched back 71% of the time.
#   * no elision saving under 4,000 characters: worth less than the retrieve
#     round it invites.
[proxy.providers.anthropic]
retrieve_tool = "always"
frozen_prefix = "first_seen"
cache_ttl = "adaptive"

[proxy.providers.anthropic.engine]
enable_code_aware = false
min_elision_saving_chars = 4000

# --- Claude Desktop's Code tab: TLS intercept ----------------------------
# Desktop overwrites ANTHROPIC_BASE_URL when it spawns a session, so there is no
# base URL to point at this proxy. It does honour HTTPS_PROXY and a custom CA.
#
# On by default. Two things happen on first start that are worth knowing about
# before they happen rather than after:
#
#   * a CONNECT proxy listens on the address below. It terminates TLS only for
#     the hosts named in `intercept_hosts` and copies every other connection
#     byte for byte without reading it.
#   * a local certificate authority is generated under `ca_path` if none is
#     there. The key is written 0600 and never leaves that directory. Nothing
#     trusts it until you install it somewhere, and a client that has not been
#     pointed here is unaffected either way.
#
# To turn it off, comment out `listen` — the listener is off unless an address
# is named. Remove the CA directory as well if you had already trusted it.
# See docs/CLAUDE-DESKTOP.md.
[proxy.intercept]
listen = "127.0.0.1:8840"
intercept_hosts = ["api.anthropic.com"]
ca_path = "/var/lib/kompressor/ca"
# h2 is required: Desktop offers only h2 for api.anthropic.com, and a listener
# advertising http/1.1 alone fails the handshake like an untrusted certificate.
alpn = ["h2", "http/1.1"]

# --- OpenAI / Codex -------------------------------------------------------
# API-key callers go to api.openai.com; ChatGPT-plan callers are recognised by
# their credential and sent to chatgpt.com instead, websocket included.
[[proxy.upstreams]]
name = "openai"
path_prefix = "/v1"
base_url = "https://api.openai.com"
api_family = "openai"
forward_auth = true

[proxy.upstreams.subscription]
base_url = "https://chatgpt.com"
rewrite_prefix = "/backend-api/codex"

# Codex desktop on a ChatGPT plan calls this path directly.
[[proxy.upstreams]]
name = "codex-desktop-chatgpt"
path_prefix = "/backend-api/codex"
base_url = "https://chatgpt.com"
strip_prefix = false
api_family = "openai"
forward_auth = true

# The rest of the ChatGPT surface (rate limits, identity, token refresh),
# forwarded untouched. A 404 here makes Codex drop the subscription.
[[proxy.upstreams]]
name = "chatgpt-rest"
path_prefix = "/backend-api"
base_url = "https://chatgpt.com"
api_family = "passthrough"
forward_auth = true

# --- Anthropic / Claude ---------------------------------------------------
# Claude takes the longer prefix, Codex keeps /v1. That way round because
# `rewrite_prefix` replaces the matched mount prefix: a mount on /v1/responses
# leaves an empty tail and a subscription request reaches chatgpt.com as
# /backend-api/codex/ -- a 404 that reads like a broken login. Longer prefixes
# win, so /v1/messages lands here rather than on "openai".
[[proxy.upstreams]]
name = "anthropic"
path_prefix = "/v1/messages"
base_url = "https://api.anthropic.com"
api_family = "anthropic"
forward_auth = true

# Claude also probes /api/hello and signs in through /api/oauth/*.
# Without this mount it takes a 404 from the proxy mid-session.
[[proxy.upstreams]]
name = "anthropic-api"
path_prefix = "/api"
base_url = "https://api.anthropic.com"
api_family = "passthrough"
forward_auth = true
