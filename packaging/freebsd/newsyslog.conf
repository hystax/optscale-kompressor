# Rotates the rc.d service's output. daemon(8) reopens its -o file on SIGHUP,
# and the pid file is the supervisor's, which is the process that holds it.
# logfilename              [owner:group]        mode count size when  flags [/pid_file]                       [sig_num]
/var/log/kompressor.log    kompressor:kompressor 640  7     1000 *     JC    /var/run/kompressor/daemon.pid    SIGHUP
