# CI for kompressor.
#
# Every job here runs a Makefile target rather than its own command line. That
# is the point: `make lint` says "as CI runs them" and `make check` says
# "everything CI gates on", and those comments are only true if this file does
# not have a second opinion. A gate that exists only here cannot be reproduced
# locally, and one that exists only in the Makefile does not gate anything.
#
# `make check` is lint + test + bench + docs-check. It is split across jobs so a
# formatting mistake fails in under a minute instead of behind a corpus replay,
# and so the slow ones run in parallel.
#
# The toolchain and the cache are set up by hand rather than by the usual
# `dtolnay/rust-toolchain` and `Swatinem/rust-cache`. That is deliberate and not
# a style preference: this repository runs under an org Actions allowlist that
# permits GitHub-owned and verified-creator actions only, and both of those are
# published from personal accounts. Referencing either one fails the whole run
# at startup — no jobs, no logs, no annotation on the file that caused it. If
# you add a third-party action here, confirm it is on the allowlist first.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant. `main` is
# excluded so a merged commit is always fully verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # A fresh runner never reuses incremental artifacts, so producing them only
  # costs disk and makes the cache bigger for nothing.
  CARGO_INCREMENTAL: 0
  # No one attaches a debugger to a CI run, and the symbols are most of the
  # bytes. `cargo test --workspace` links a separate test binary per crate, so
  # debug info lands once per crate and the cache it is saved into grew to
  # 2.1 GB against 0.2-0.5 GB for every other job — until a run restored it,
  # built on top and filled the disk, killing the linker with SIGBUS at 21 MB
  # free. `line-tables-only` keeps panic backtraces readable, which is the one
  # thing a failing test actually needs.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy --no-self-update
          rustup default stable
      - uses: actions/cache@v4
        with:
          # `~/.cargo/bin` is deliberately not cached: restoring it over the
          # runner's preinstalled binaries is how a cache starts shadowing the
          # toolchain the job just asked for.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-
      - run: make lint

  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # `code-aware` pulls in the tree-sitter grammars and is on by default.
        # Without it the code compressor declines rather than disappearing, so
        # the build has to work both ways and the tests have to pass both ways
        # — this is `make test-matrix`, split so the two report separately.
        include:
          - features: default
            flags: ""
          - features: no-default-features
            flags: "--no-default-features"
    steps:
      - uses: actions/checkout@v4
      # This job builds a test binary per crate on top of a restored cache and
      # is the only one that has ever run the runner out of disk. The image
      # ships ~20 GB of toolchains nothing here uses; reclaiming them is both
      # cheaper and more honest than trimming what the build legitimately
      # needs. `|| true` throughout: a path that has moved between images is
      # not a reason to fail the job, and `df` leaves the margin in the log so
      # the next person does not have to infer it.
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # No `restore-keys` here, unlike the other jobs. A prefix match
          # restores the previous lockfile's `target/` and builds on top of it,
          # and nothing in this hand-rolled cache ever evicts what is now
          # stale — which is how 2.1 GB accumulated. An exact-key miss costs
          # one cold build; the fallback cost a green run.
          key: ${{ runner.os }}-cargo-test-${{ matrix.features }}-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --workspace ${{ matrix.flags }}

  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pinned to the `rust-version` in Cargo.toml. Declaring an MSRV that was
      # never built is a claim, not a fact; this is the only thing that makes it
      # one. Bump both together or not at all.
      #
      # 1.95 is set by the dependency graph, not by anything this workspace
      # writes: parking_lot 0.13 requires it, and before that 1.90 was
      # tree-sitter-language's floor. Note that cargo resolves `rust-version`
      # across the whole locked graph, so `--no-default-features` does not lower
      # it even though it deactivates the grammars.
      - name: toolchain
        run: |
          rustup toolchain install 1.95 --profile minimal --no-self-update
          rustup default 1.95
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-
      - run: cargo check --workspace --all-targets

  gate:
    name: bench, docs and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-gate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-gate-
      # All three need the release binary, so they share a job and build it
      # once. `release` is phony; the second and third calls are no-ops.
      - name: build
        run: make release

      # Replays the committed corpus and compares against fixtures/baseline.json
      # to four decimal places, and checks determinism. Moving the gate is
      # `make bench-save`, which asks first and is never run here.
      - name: bench
        run: make bench

      # The docs against the binary that ships: the config reference has to
      # parse, documented endpoints have to be served, and the § cross-links
      # have to resolve.
      - name: docs
        run: make docs-check

      # Whether the assembled binary actually serves. Scratch directory,
      # ephemeral port, no provider and no credentials.
      - name: smoke
        run: make smoke

  e2e:
    name: e2e (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The suite runs on an `internal: true` network, so a green run cannot be
      # green because it reached a real provider. Only the image build needs the
      # network. This is `make check-full` minus what the jobs above already did.
      - name: e2e
        run: make e2e
      - name: tear down
        if: always()
        run: make e2e-down
